[tool.poetry]
name = "driveforge"
version = "1.0.0"
description = "DriveForge — Deep Reinforcement Learning for Autonomous Driving."
authors = ["Asad Idrees Razak <idreesshaikh6300@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.7"
tensorboard = "^2.10.0"
torch = { url = "https://download.pytorch.org/whl/cu113/torch-1.12.0%2Bcu113-cp37-cp37m-win_amd64.whl" }
torchvision = { url = "https://download.pytorch.org/whl/cu113/torchvision-0.13.0%2Bcu113-cp37-cp37m-win_amd64.whl"} 

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
